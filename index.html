<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrated Farming System Recommender</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌾 Integrated Farming System Recommender 🌾</h1>
      <p class="subtitle">In Collaboration with <b>Krishi Vigyan Kendra</b></p>
    </header>

    <section class="intro">
      <p>
        The <b>Integrated Farming System (IFS)</b> model helps farmers identify suitable crops, fruits, 
        and flowers based on their <b>district</b>, <b>soil type</b>, and <b>available land area</b>.
      </p>
    </section>

    <form action="/predict" method="POST" class="prediction-form">
      <div class="form-group">
        <label>District:</label>
        <input type="text" name="district" placeholder="e.g., Lucknow" required>
      </div>

      <div class="form-group">
        <label>Land Area (hectare):</label>
        <input type="number" name="land_area" value="1" step="0.1" required>
      </div>

      <div class="form-group">
        <label>Soil Type:</label>
        <select name="soil_type" required>
          <option value="">-- Select Soil Type --</option>
          <option value="loamy">Loamy</option>
          <option value="clayey">Clayey</option>
          <option value="sandy">Sandy</option>
          <option value="silty">Silty</option>
          <option value="peaty">Peaty</option>
          <option value="chalky">Chalky</option>
        </select>
      </div>

      <button type="submit" class="btn">🌿 Predict Suitable Crop</button>
    </form>
  </div>
</body>
</html>
